name: Android build

on:
  push:
    paths:
      - 'apps/star-sprout-sprint/**'
      - '.github/workflows/android.yml'
      - 'docs/**'
  pull_request:
    paths:
      - 'apps/star-sprout-sprint/**'
      - '.github/workflows/android.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare upload key (optional)
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p apps/star-sprout-sprint/app/build/keys
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/star-sprout-sprint/app/build/keys/upload.jks
      - name: Run JVM unit tests
        run: ./apps/star-sprout-sprint/gradlew -p apps/star-sprout-sprint --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK and release AAB
        run: ./apps/star-sprout-sprint/gradlew -p apps/star-sprout-sprint --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Rebuild signed release bundle when key is configured
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/star-sprout-sprint/app/build/keys/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./apps/star-sprout-sprint/gradlew -p apps/star-sprout-sprint --no-daemon :app:bundleRelease
      - name: Run instrumented tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./apps/star-sprout-sprint/gradlew -p apps/star-sprout-sprint --no-daemon :app:connectedDebugAndroidTest
      - name: Print Android test failure details
        if: always()
        run: |
          for report in apps/star-sprout-sprint/app/build/outputs/androidTest-results/connected/**/*.xml; do
            [ -f "$report" ] || continue
            echo "===== $report ====="
            cat "$report"
          done
      - name: Save build outputs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-sprout-sprint-build
          path: |
            apps/star-sprout-sprint/app/build/outputs/apk/debug/*.apk
            apps/star-sprout-sprint/app/build/outputs/bundle/release/*.aab
            apps/star-sprout-sprint/app/build/reports/tests/testDebugUnitTest/**
            apps/star-sprout-sprint/app/build/reports/androidTests/connected/**
          if-no-files-found: warn

