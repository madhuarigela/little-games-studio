name: Slice Galaxy Android build

on:
  push:
    paths:
      - 'apps/slice-galaxy/**'
      - '.github/workflows/slice-galaxy.yml'
  pull_request:
    paths:
      - 'apps/slice-galaxy/**'
      - '.github/workflows/slice-galaxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify-apk:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run Android lint
        run: gradle -p apps/slice-galaxy --no-daemon assembleDebug lintDebug
      - name: Verify APK signature and launchable activity
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/slice-galaxy/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/slice-galaxy-badging.txt
          grep -q "package: name='com.madhuarigela.slicegalaxy'" /tmp/slice-galaxy-badging.txt
          grep -q "launchable-activity: name='com.madhuarigela.slicegalaxy.MainActivity'" /tmp/slice-galaxy-badging.txt
          echo "APK exists, signature verifies, package ID and launchable activity are correct."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slice-galaxy-debug-apk
          path: apps/slice-galaxy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
