name: Slice Galaxy Android build

on:
  push:
    paths:
      - 'apps/slice-galaxy/**'
      - '.github/workflows/slice-galaxy.yml'
  pull_request:
    paths:
      - 'apps/slice-galaxy/**'
      - '.github/workflows/slice-galaxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p apps/slice-galaxy --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slice-galaxy-debug-apk
          path: apps/slice-galaxy/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
