plugins {
    id 'com.android.application'
}

android {
    namespace 'com.madhuarigela.starsproutsprint'
    compileSdk 37

    defaultConfig {
        applicationId 'com.madhuarigela.starsproutsprint'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def uploadStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    if (uploadStorePath) {
        signingConfigs {
            release {
                storeFile file(uploadStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadStorePath) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
